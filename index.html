<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub to ECR CI Pipeline</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
    }

    main {
      width: min(42rem, calc(100% - 3rem));
      padding: 3rem;
      border: 1px solid #334155;
      border-radius: 1rem;
      background: #111827;
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      color: #38bdf8;
    }

    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: #14532d;
      color: #bbf7d0;
    }
  </style>
</head>
<body>
  <main>
    <p>Cloud-native CI foundation</p>
    <h1>GitHub to ECR CI Pipeline</h1>
    <p>This page was packaged by Docker and published by a Jenkins CI/CD pipeline on AWS.</p>
    <span class="badge">Version 2</span>
  </main>
</body>
</html>
